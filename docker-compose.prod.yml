# Production stack for the hosted deployment.
#
# Differences from docker-compose.yml, and why:
#
#   * Only Caddy publishes ports. Elasticsearch, Kibana and the model server
#     are reachable on the internal network only — the development compose
#     file binds 9200/5601/8080 to the host, which is fine on a laptop and
#     unacceptable on a public server.
#
#   * The dashboard is built and served as static assets rather than run
#     through the Vite dev server.
#
#   * live-stream runs as a long-lived service, so the console shows real
#     traffic arriving continuously instead of only when a script is run.
#
# Usage:
#     cp .env.prod.example .env.prod   (then fill it in)
#     docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}
      - xpack.security.enabled=true
      # A 1 GB heap fits comfortably on a 2 GB server and stops Elasticsearch
      # claiming half of physical RAM by default, which is what triggers the
      # OOM-kill on small instances.
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    # No ports: reachable only from the Compose network.

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${KIBANA_SERVICE_TOKEN:-}
      # Served under /kibana by Caddy, so Kibana has to know its own base path.
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - SERVER_PUBLICBASEURL=https://${DOMAIN}/kibana
      - xpack.security.session.idleTimeout=15m
      - xpack.security.session.lifespan=24h
    depends_on:
      elasticsearch:
        condition: service_healthy

  lstm-serving:
    build:
      context: .
      dockerfile: Dockerfile.serving
    restart: unless-stopped
    volumes:
      - ./models/lstm_checkpoint_best.pt:/checkpoint/lstm_checkpoint_best.pt:ro
      - onnx_models:/models
    environment:
      - MODEL_PATH=/models/lstm_fraud_detector.onnx
      - CHECKPOINT_PATH=/checkpoint/lstm_checkpoint_best.pt
      - DECISION_THRESHOLD=${DECISION_THRESHOLD:-0.90}
      - MODEL_VERSION=${MODEL_VERSION:-1.2.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models/lstm')"]
      interval: 15s
      timeout: 10s
      retries: 10

  # The continuous transaction stream. One transaction every few seconds,
  # scored by the real model and the real rules, written to Elasticsearch —
  # this is what makes the hosted dashboard move on its own.
  live-stream:
    build:
      context: .
      dockerfile: Dockerfile.stream
    restart: unless-stopped
    environment:
      - ELASTIC_HOST=http://elasticsearch:9200
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}
      - LSTM_SERVING_URL=http://lstm-serving:8080
      - STREAM_INTERVAL_MIN=${STREAM_INTERVAL_MIN:-4}
      - STREAM_INTERVAL_MAX=${STREAM_INTERVAL_MAX:-12}
    depends_on:
      elasticsearch:
        condition: service_healthy
      lstm-serving:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN must be set}
      - ACME_EMAIL=${ACME_EMAIL:?ACME_EMAIL must be set}
      # base64("elastic:<password>") — injected into /api requests so the
      # browser never receives the cluster password. Generated by deploy/init.sh.
      - ES_BASIC_AUTH=${ES_BASIC_AUTH:?ES_BASIC_AUTH must be set}
    volumes:
      - caddy_data:/data      # certificates — must persist or TLS re-issues
      - caddy_config:/config
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es_data:
  onnx_models:
  caddy_data:
  caddy_config:
