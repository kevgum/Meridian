services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-meridian123}
      - xpack.security.enabled=true
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-meridian123} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # ES 8.11 forbids the elastic superuser for Kibana — use a service account token.
      # Run scripts/bootstrap_rbac.py after first stack start to create this token,
      # then set KIBANA_SERVICE_TOKEN in .env.
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${KIBANA_SERVICE_TOKEN:-}
      # PCI DSS Req 8.2.8 — idle session timeout: 15 minutes
      - xpack.security.session.idleTimeout=15m
      - xpack.security.session.lifespan=24h
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    ports:
      - "5000:5000"
    volumes:
      - ./logstash/pipelines/transaction_ingest.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-meridian123}
      # Disable xpack monitoring to avoid 401 errors when no monitoring cluster is configured
      - xpack.monitoring.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy

  lstm-serving:
    build:
      context: .
      dockerfile: Dockerfile.serving
    ports:
      - "8080:8080"
    volumes:
      - ./models/lstm_checkpoint_best.pt:/checkpoint/lstm_checkpoint_best.pt:ro
      - ./models/serving/lstm_v1:/models
    environment:
      - MODEL_PATH=/models/lstm_fraud_detector.onnx
      - CHECKPOINT_PATH=/checkpoint/lstm_checkpoint_best.pt
      - DECISION_THRESHOLD=${DECISION_THRESHOLD:-0.92}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models/lstm')"]
      interval: 15s
      timeout: 5s
      retries: 5

  feature-engineering:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-meridian123}
      - LSTM_SERVING_URL=http://lstm-serving:8080
    command: >
      sh -c "pip install -q elasticsearch pandas numpy scikit-learn pyyaml requests &&
             python -m src.pipeline.run_pipeline --mock"
    depends_on:
      elasticsearch:
        condition: service_healthy
      lstm-serving:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # dev — test runner and developer toolbox
  # ---------------------------------------------------------------------------
  # This service is only started when the "dev" profile is active.
  # It is never included in a plain `docker compose up -d`.
  #
  # Run the full test suite:
  #   docker compose --profile dev run --rm dev
  # Run a specific test file:
  #   docker compose --profile dev run --rm dev pytest tests/test_siem_rules.py -v
  # Run the latency benchmark:
  #   docker compose --profile dev run --rm dev python -m src.benchmark
  # Run type checks:
  #   docker compose --profile dev run --rm dev mypy src/
  #
  # NOTE: docker compose run does NOT honour depends_on health conditions.
  # The start.sh / start.ps1 scripts explicitly wait for lstm-serving to be
  # healthy before invoking this container.
  # ---------------------------------------------------------------------------
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # Mount the entire project so tests and source code are live —
      # no rebuild needed when changing Python files.
      - .:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      # Tests that call the LSTM API use this URL (Docker internal hostname)
      - LSTM_SERVING_URL=http://lstm-serving:8080
      - DECISION_THRESHOLD=${DECISION_THRESHOLD:-0.92}
    # depends_on is honoured by `docker compose up` (not `run`).
    # Kept here for documentation purposes and future compose watch support.
    depends_on:
      lstm-serving:
        condition: service_healthy

volumes:
  es_data:
