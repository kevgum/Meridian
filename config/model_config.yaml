model:
  input_features: 12
  sequence_length: 5
  hidden_size_1: 128
  hidden_size_2: 64
  dropout: 0.30

training:
  learning_rate: 0.001
  batch_size: 512
  epochs: 20
  calibration_epochs: 5
  calibration_subset: 0.20
  seed: 42

loss:
  # WeightedRandomSampler balances batches to 50/50 fraud/normal.
  # pos_weight MUST be 1.0 here — any value > 1 tips loss asymmetry toward always predicting fraud.
  pos_weight: 1.0

paths:
  data_dir: data/processed
  model_dir: models
  results_dir: results
  serving_dir: models/serving/lstm_v1
