model:
  input_features: 12
  sequence_length: 5
  hidden_size_1: 128
  hidden_size_2: 64
  dropout: 0.30

training:
  learning_rate: 0.001
  batch_size: 512
  epochs: 10
  calibration_epochs: 5
  calibration_subset: 0.20
  seed: 42

loss:
  # WeightedRandomSampler handles class balance in batches (50% fraud/50% normal).
  # pos_weight provides a mild additional nudge — keep low (1–5) to avoid instability.
  pos_weight: 2.0

paths:
  data_dir: data/processed
  model_dir: models
  results_dir: results
  serving_dir: models/serving/lstm_v1
