# =============================================================================
# docker-compose.tls.yml — TLS overlay for Meridian Sentinel
# =============================================================================
# Adds TLS 1.3 on the Elasticsearch HTTP layer (PCI DSS Req 4.2.1, APRA CPS 234).
#
# Prerequisites:
#   1. Generate certs:  ./scripts/generate_certs.sh
#   2. Update .env:     ELASTIC_HOST=https://localhost:9200
#
# Usage (merges on top of the base compose file):
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Clients (bootstrap_rbac.py, tests) must pass ca_certs="certs/ca.crt" and
# set verify_certs=True, or set ELASTIC_CA_CERT=certs/ca.crt in .env.
# =============================================================================

services:

  elasticsearch:
    environment:
      # Enable TLS on the HTTP layer
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/elasticsearch.crt
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/elasticsearch.key
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca.crt
      # Enforce TLS 1.3 minimum (PCI DSS Req 4.2.1)
      - xpack.security.http.ssl.supported_protocols=[TLSv1.3]
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      # Switch healthcheck from http:// to https:// with CA cert
      test:
        - "CMD-SHELL"
        - >
          curl -s --cacert /usr/share/elasticsearch/config/certs/ca.crt
          -u elastic:${ELASTIC_PASSWORD:-meridian123}
          https://localhost:9200/_cluster/health
          | grep -q '"status":"green\|yellow"'
      interval: 15s
      timeout: 10s
      retries: 5

  kibana:
    environment:
      # Point Kibana at the HTTPS endpoint
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca.crt
    volumes:
      - ./certs:/usr/share/kibana/config/certs:ro

  logstash:
    environment:
      # Logstash ES output SSL settings (referenced in pipeline config)
      - ELASTIC_CA_CERT=/usr/share/logstash/config/certs/ca.crt
    volumes:
      - ./certs:/usr/share/logstash/config/certs:ro
