# =============================================================================
# Meridian Sentinel — Logstash Transaction Ingestion Pipeline
# =============================================================================
# Receives raw PaySim/banking JSON events over TCP, normalises them to the
# Elastic Common Schema (ECS), hashes all PII fields with SHA-256 (Australian
# Privacy Act 1988), and writes to Elasticsearch.
#
# Input shape (JSON sent by the feature engineering service):
#   {
#     "step": 1, "type": "TRANSFER", "amount": 12500.00,
#     "nameOrig": "C1234567890", "oldbalanceOrg": 20000.0, "newbalanceOrig": 7500.0,
#     "nameDest": "M9921",       "oldbalanceDest": 0.0,   "newbalanceDest": 12500.0,
#     "isFraud": 1, "isFlaggedFraud": 0,
#     "lat": -33.8688, "lon": 151.2093,
#     "prev_lat": -37.8136, "prev_lon": 144.9631,
#     "timestamp": "2025-06-30T23:15:00+10:00",
#     "prev_timestamp": "2025-06-30T22:45:00+10:00",
#     "merchant_id": "M9921"
#   }
# =============================================================================

input {
  tcp {
    port  => 5000
    codec => json_lines

    # Tag every event with its pipeline source for downstream filtering
    add_field => { "[@metadata][pipeline]" => "transaction_ingest" }
  }
}

filter {

  # ---------------------------------------------------------------------------
  # 1. Parse and set @timestamp from the event's own timestamp field.
  #    Logstash's default @timestamp is ingest time, not transaction time.
  # ---------------------------------------------------------------------------
  if [timestamp] {
    date {
      match    => ["timestamp", "ISO8601"]
      target   => "@timestamp"
      timezone => "UTC"
    }
  }

  # ---------------------------------------------------------------------------
  # 2. Rename raw PaySim fields to ECS-aligned names.
  #    ECS reference: https://www.elastic.co/guide/en/ecs/current/index.html
  # ---------------------------------------------------------------------------
  mutate {
    rename => {
      # Transaction metadata
      "type"          => "[transaction][type]"
      "amount"        => "[transaction][amount]"
      "step"          => "[transaction][step]"

      # Source account balances
      "oldbalanceOrg"  => "[source][account][balance][before]"
      "newbalanceOrig" => "[source][account][balance][after]"

      # Destination account balances
      "oldbalanceDest" => "[destination][account][balance][before]"
      "newbalanceDest" => "[destination][account][balance][after]"

      # Geographic coordinates — kept as raw fields for SIEM Rule 2
      "lat"            => "[source][geo][lat]"
      "lon"            => "[source][geo][lon]"
      "prev_lat"       => "[source][geo][prev_lat]"
      "prev_lon"       => "[source][geo][prev_lon]"
      "prev_timestamp" => "[source][geo][prev_timestamp]"

      # Fraud labels (retained for Kibana dashboards and model evaluation)
      "isFraud"        => "[labels][is_fraud]"
      "isFlaggedFraud" => "[labels][is_flagged_fraud]"

      # Merchant identifier used by SIEM Rule 4
      "merchant_id"    => "[transaction][merchant_id]"
    }

    # Tag the event type for index routing
    add_field  => { "[event][kind]"     => "event" }
    add_field  => { "[event][category]" => "financial" }
    add_field  => { "[event][type]"     => "transaction" }
    add_field  => { "[data_stream][dataset]" => "meridian.transactions" }
  }

  # ---------------------------------------------------------------------------
  # 3. SHA-256 PII hashing — Australian Privacy Act 1988 compliance.
  #    nameOrig and nameDest are customer/merchant identifiers that must never
  #    be stored in plaintext.  The fingerprint filter applies a keyed SHA-256
  #    hash and writes the result to the ECS user.id fields.
  #    The source key must match the value in config/model_config.yaml.
  # ---------------------------------------------------------------------------
  fingerprint {
    source            => "nameOrig"
    target            => "[source][user][id]"
    method            => "SHA256"
    key               => "meridian-sentinel-pii-v1"
    concatenate_sources => false
  }

  fingerprint {
    source            => "nameDest"
    target            => "[destination][user][id]"
    method            => "SHA256"
    key               => "meridian-sentinel-pii-v1"
    concatenate_sources => false
  }

  # Remove the raw plaintext PII fields after hashing
  mutate {
    remove_field => ["nameOrig", "nameDest", "timestamp"]
  }

  # ---------------------------------------------------------------------------
  # 4. Coerce numeric types — JSON over TCP can arrive as strings.
  # ---------------------------------------------------------------------------
  mutate {
    convert => {
      "[transaction][amount]"                => "float"
      "[source][account][balance][before]"   => "float"
      "[source][account][balance][after]"    => "float"
      "[destination][account][balance][before]" => "float"
      "[destination][account][balance][after]"  => "float"
      "[source][geo][lat]"                   => "float"
      "[source][geo][lon]"                   => "float"
      "[source][geo][prev_lat]"              => "float"
      "[source][geo][prev_lon]"              => "float"
      "[labels][is_fraud]"                   => "integer"
      "[labels][is_flagged_fraud]"           => "integer"
    }
  }

  # ---------------------------------------------------------------------------
  # 5. Drop any event that failed to parse (missing mandatory fields).
  #    Malformed events are tagged [_jsonparsefailure] by the json_lines codec.
  # ---------------------------------------------------------------------------
  if "_jsonparsefailure" in [tags] {
    drop {}
  }

}

output {
  # ---------------------------------------------------------------------------
  # Primary output — Elasticsearch daily index
  # ---------------------------------------------------------------------------
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"

    # Daily indices: meridian-transactions-2025.06.30
    index    => "meridian-transactions-%{+YYYY.MM.dd}"

    # ILM / data stream settings (disabled for prototype; enable for production)
    manage_template => false
  }

  # ---------------------------------------------------------------------------
  # Debug output — echoes each processed event to container stdout.
  # Disable in production by removing this block.
  # ---------------------------------------------------------------------------
  stdout {
    codec => rubydebug
  }
}
